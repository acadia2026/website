---
layout: default
---

<style>
  /* Loaded only by pages that select the program layout. */
  .container {
    box-sizing: border-box;
    width: calc(100% - 32px);
    max-width: 1440px;
  }

  .program-heading {
    margin: 24px 0 12px;
    font-weight: 400;
  }

  .program-embed {
    width: 100%;
    min-width: 0;
  }

  .program-embed iframe {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 90vh;
    height: 90svh;
    min-height: 420px;
    border: 0;
    background: #fff;
  }

  @media (max-width: 700px) {
    .container {
      width: calc(100% - 20px);
    }

    .menu {
      flex-wrap: wrap;
    }

    .menu > ul {
      width: 100%;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 4px;
    }

    .menu .dropdown-menu {
      right: auto;
      left: 0;
    }
  }
</style>

{{ content }}
